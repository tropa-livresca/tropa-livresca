          $ref: "#/components/responses/Error"
  /clients/loja/frete:
    get:
      tags: [Loja]
      summary: Calcular frete e prazo
      operationId: calcularFretePrazo
      responses:
        "200":
          $ref: "#/components/responses/Success"
