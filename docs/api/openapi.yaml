openapi: 3.0.3
info:
  title: API Tropa Livresca
  version: 1.0.0
  description: >-
    API do site Tropa Livresca. Rotas de cliente usam o cookie auth-token;
    rotas administrativas usam admin-token e também verificam is_admin. As
    rotas de usuários e movimentações administrativas exigem is_master.
    Erros usam {status, statusCode, error}; statusCode é o código HTTP enviado
    pelo middleware. Listas paginadas usam page (padrão 1), limit (padrão 12)
    e meta.totalItems/totalPages quando indicado.
servers:
  - url: /api/v1
    description: API versionada
tags:
  - name: Autenticação
  - name: Autopublicação
  - name: Endereços
  - name: Livros
  - name: Autores
  - name: Suporte
  - name: Perfil
  - name: Loja
  - name: Avaliações
  - name: Comentários
  - name: Revisões
  - name: Usuários
  - name: Movimentações Financeiras
paths:
  /auth/signin-adm:
    post:
      tags: [Autenticação]
      summary: Iniciar sessão administrativa
      operationId: signinAdm
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminSigninRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /auth/signout-adm:
    post:
      tags: [Autenticação]
      summary: Encerrar sessão administrativa
      operationId: signoutAdm
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /auth/senhaadm:
    patch:
      tags: [Autenticação]
      summary: Alterar senha administrativa
      operationId: alterarSenhaAdm
      security:
        - adminCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SenhaAdminRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /auth/session-adm:
    get:
      tags: [Autenticação]
      summary: Consultar sessão administrativa
      operationId: getSessionAdm
      security:
        - adminCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /auth/session-adm-master:
    get:
      tags: [Autenticação]
      summary: Consultar sessão de administrador master
      operationId: getSessionAdmMaster
      security:
        - adminCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /auth/senhaantiga:
    patch:
      tags: [Autenticação]
      summary: Alterar senha administrativa antiga
      operationId: alterarSenhaAntigaAdm
      security:
        - adminCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SenhaAdminAntigaRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /auth/signup:
    post:
      tags: [Autenticação]
      summary: Criar conta
      operationId: signup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupRequest"
      responses:
        "201":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /auth/signin:
    post:
      tags: [Autenticação]
      summary: Iniciar sessão
      operationId: signin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SigninRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /auth/signin/google:
    get:
      tags: [Autenticação]
      summary: Iniciar autenticação Google por redirecionamento
      operationId: signinGoogleRedirect
      parameters:
        - name: redirectTo
          in: query
          schema:
            type: string
            format: uri
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Autenticação]
      summary: Iniciar sessão com Google
      operationId: signinGoogle
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                redirectTo:
                  type: string
                  format: uri
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /auth/signout:
    post:
      tags: [Autenticação]
      summary: Encerrar sessão
      operationId: signout
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /auth/refresh:
    post:
      tags: [Autenticação]
      summary: Atualizar sessão
      operationId: refreshSession
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /auth/session:
    post:
      tags: [Autenticação]
      summary: Definir sessão
      operationId: setSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSessionRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
    get:
      tags: [Autenticação]
      summary: Consultar sessão atual
      operationId: getSession
      security:
        - clientCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /auth/redefinir-senha:
    post:
      tags: [Autenticação]
      summary: Redefinir senha
      operationId: redefinirSenha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RedefinirSenhaRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /auth/esquecer-senha:
    post:
      tags: [Autenticação]
      summary: Solicitar recuperação de senha
      operationId: esquecerSenha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /auth/callback-redefinir-senha/:
    get:
      tags: [Autenticação]
      summary: Processar callback de redefinição de senha
      operationId: callbackRedefinirSenha
      responses:
        "302":
          description: Redireciona para a URL de redefinição de senha configurada no servidor.
          headers:
            Location:
              schema:
                type: string
                format: uri
        default:
          $ref: "#/components/responses/Error"
  /auth/senha:
    patch:
      tags: [Autenticação]
      summary: Atualizar senha da conta
      operationId: atualizarSenha
      security:
        - clientCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [senhaAntiga, senhaNova]
              properties:
                senhaAntiga:
                  type: string
                  format: password
                senhaNova:
                  type: string
                  format: password
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /auth/perfil:
    get:
      tags: [Autenticação]
      summary: Consultar usuário autenticado
      operationId: getAuthProfile
      security:
        - clientCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/autopublicacao:
    get:
      tags: [Autopublicação]
      summary: Listar livros de autopublicação com filtros
      operationId: listarAutopublicacoes
      security:
        - clientCookieAuth: []
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: busca
          in: query
          schema:
            type: string
        - name: filtro
          in: query
          description: '"alfabetico" ou "data".'
          schema:
            type: string
            enum: [alfabetico, data, ""]
        - name: ordem
          in: query
          description: '"ascendente" ou "descendente".'
          schema:
            type: string
            enum: [ascendente, descendente, ""]
        - name: estado
          in: query
          description: Filtra por estado canônico; vazio lista todos.
          schema:
            $ref: "#/components/schemas/LivroEstadoFiltro"
      responses:
        "200":
          description: Lista paginada de livros do usuário autenticado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginaLivros"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Autopublicação]
      summary: Criar livro para autopublicação
      operationId: criarAutopublicacao
      security:
        - clientCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CriarAutopublicacaoRequest"
      responses:
        "201":
          description: Livro criado inicialmente como rascunho.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopublicacaoSalva"
        default:
          $ref: "#/components/responses/Error"
  /clients/autopublicacao/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Autopublicação]
      summary: Consultar livro de autopublicação
      operationId: buscarAutopublicacao
      security:
        - clientCookieAuth: []
      responses:
        "200":
          description: Livro do usuário, com URLs assinadas para capa e manuscrito.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LivroAutopublicacao"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [Autopublicação]
      summary: Atualizar livro de autopublicação
      operationId: atualizarAutopublicacao
      security:
        - clientCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtualizarAutopublicacaoRequest"
      responses:
        "200":
          description: Livro atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutopublicacaoSalva"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Autopublicação]
      summary: Excluir rascunho de autopublicação
      operationId: excluirAutopublicacao
      security:
        - clientCookieAuth: []
      responses:
        "200":
          description: Rascunho removido sem corpo de resposta.
        default:
          $ref: "#/components/responses/Error"
  /clients/autopublicacao/upload-url:
    post:
      tags: [Autopublicação]
      summary: Criar URL de upload de livro
      operationId: criarUploadLivro
      security:
        - clientCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadLivroRequest"
      responses:
        "200":
          description: URL assinada para upload direto no bucket retornado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlResponse"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Autopublicação]
      summary: Remover uploads temporários de livro
      operationId: limparUploadsLivro
      security:
        - clientCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LimparUploadsRequest"
      responses:
        "204":
          description: Uploads temporários removidos; resposta sem corpo.
        default:
          $ref: "#/components/responses/Error"
  /clients/autopublicacao/estado/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Autopublicação]
      summary: Atualizar estado da autopublicação
      operationId: atualizarEstadoAutopublicacao
      security:
        - clientCookieAuth: []
      description: >-
        O cliente só pode transicionar rascunho, negado ou recall para
        em_revisao. Estados aceitos: rascunho, em_revisao, publicado, negado,
        recall; a transição depende do estado atual do livro.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AtualizarEstadoLivroRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/enderecos:
    get:
      tags: [Endereços]
      summary: Listar endereços do usuário
      operationId: listarEnderecos
      security:
        - clientCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Endereços]
      summary: Criar endereço
      operationId: criarEndereco
      security:
        - clientCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnderecoRequest"
      responses:
        "201":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/enderecos/principal:
    get:
      tags: [Endereços]
      summary: Consultar endereço principal
      operationId: buscarEnderecoPrincipal
      security:
        - clientCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/enderecos/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Endereços]
      summary: Consultar endereço
      operationId: buscarEndereco
      security:
        - clientCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [Endereços]
      summary: Atualizar endereço
      operationId: atualizarEndereco
      security:
        - clientCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnderecoRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/enderecos/{id}/ativo:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Endereços]
      summary: Inativar endereço
      operationId: inativarEndereco
      security:
        - clientCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/enderecos/{id}/principal:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Endereços]
      summary: Definir endereço principal
      operationId: definirEnderecoPrincipal
      security:
        - clientCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/livros:
    get:
      tags: [Livros]
      summary: Listar livros
      operationId: listarLivros
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: busca
          in: query
          schema:
            type: string
        - name: filtro
          in: query
          schema:
            type: string
            enum: [alfabetico, data, ""]
        - name: ordem
          in: query
          schema:
            type: string
            enum: [ascendente, descendente, ""]
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/livros/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Livros]
      summary: Consultar livro
      operationId: buscarLivro
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/autores:
    get:
      tags: [Autores]
      summary: Listar autores
      operationId: listarAutores
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: busca
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/autores/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Autores]
      summary: Consultar autor
      operationId: buscarAutor
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/suporte/enviarEmail:
    post:
      tags: [Suporte]
      summary: Enviar mensagem ao suporte
      operationId: enviarEmailSuporte
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/perfil/imagem:
    patch:
      tags: [Perfil]
      summary: Atualizar imagem do perfil
      operationId: atualizarImagemPerfil
      security:
        - clientCookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [imagem]
              properties:
                imagem:
                  type: string
                  format: binary
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Perfil]
      summary: Remover imagem do perfil
      operationId: removerImagemPerfil
      security:
        - clientCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/perfil:
    get:
      tags: [Perfil]
      summary: Consultar perfil
      operationId: buscarPerfil
      security:
        - clientCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [Perfil]
      summary: Atualizar perfil
      operationId: atualizarPerfil
      security:
        - clientCookieAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PerfilRequest"
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/loja:
    get:
      tags: [Loja]
      summary: Listar livros disponíveis na loja
      operationId: listarLivrosLoja
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: busca
          in: query
          schema:
            type: string
        - name: filtro
          in: query
          schema:
            type: string
            enum: [alfabetico, data, ""]
        - name: ordem
          in: query
          schema:
            type: string
            enum: [ascendente, descendente, ""]
        - name: categoria
          in: query
          schema:
            type: string
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/loja/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Loja]
      summary: Consultar livro na loja
      operationId: buscarLivroLoja
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/loja/venda/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Loja]
      summary: Consultar venda
      operationId: consultarVenda
      security:
        - clientCookieAuth: []
      responses:
        "201":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/loja/historico-vendas:
    get:
      tags: [Loja]
      summary: Consultar histórico de vendas do usuário
      operationId: historicoVendasUsuario
      security:
        - clientCookieAuth: []
      description: >-
        O router registra GET /:id antes deste caminho, portanto a rota de
        histórico é interceptada pelo handler de livro no estado atual.
      responses:
        "201":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/loja/numero-vendas:
    get:
      tags: [Loja]
      summary: Consultar número de vendas de um livro
      operationId: numeroVendasLivro
      description: >-
        O controller registrado lê req.params.id, mas a rota atual não declara
        parâmetro de caminho. O handler recebe id indefinido; este contrato é
        mantido explícito para não afirmar que a consulta funciona.
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/loja/frete:
    get:
      tags: [Loja]
      summary: Calcular frete e prazo
      operationId: calcularFretePrazo
      description: >-
        O controller lê cepDestino e itensVenda da query e atualmente devolve
        somente {teste: 1}; além disso, GET /:id é registrado antes e intercepta
        este caminho no Express. A rota de cálculo não é alcançável no estado
        atual do router.
      parameters:
        - name: cepDestino
          in: query
          schema:
            type: string
        - name: itensVenda
          in: query
          schema:
            type: string
      responses:
        "201":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/loja/status:
    patch:
      tags: [Loja]
      summary: Alterar status de pagamento
      operationId: alterarStatusPagamento
      security:
        - clientCookieAuth: []
      description: >-
        O controller lê email do JSON e req.params.id, mas a rota atual não
        declara id; o handler não recebe identificador de venda pela rota.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "201":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/loja/venda:
    post:
      tags: [Loja]
      summary: Realizar venda
      operationId: realizarVenda
      security:
        - clientCookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
