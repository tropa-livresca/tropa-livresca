openapi: 3.0.3
info:
  title: API Tropa Livresca
  version: 1.0.0
  description: API do site Tropa Livresca, organizada por autenticação, clientes e administração.
servers:
  - url: /api/v1
    description: API versionada
tags:
  - name: Autenticação
  - name: Autopublicação
  - name: Endereços
  - name: Livros
  - name: Autores
  - name: Suporte
  - name: Perfil
  - name: Loja
  - name: Notificações
  - name: Avaliações
  - name: Comentários
  - name: Cartões
  - name: Revisões
  - name: Usuários
  - name: Movimentações Financeiras
paths:
  /auth/signin-adm:
    post:
      tags: [Autenticação]
      summary: Iniciar sessão administrativa
      operationId: signinAdm
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /auth/signout-adm:
    post:
      tags: [Autenticação]
      summary: Encerrar sessão administrativa
      operationId: signoutAdm
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /auth/senhaadm:
    patch:
      tags: [Autenticação]
      summary: Alterar senha administrativa
      operationId: alterarSenhaAdm
      security:
        - adminCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /auth/session-adm:
    get:
      tags: [Autenticação]
      summary: Consultar sessão administrativa
      operationId: getSessionAdm
      security:
        - adminCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /auth/session-adm-master:
    get:
      tags: [Autenticação]
      summary: Consultar sessão de administrador master
      operationId: getSessionAdmMaster
      security:
        - adminCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /auth/senhaantiga:
    patch:
      tags: [Autenticação]
      summary: Alterar senha administrativa antiga
      operationId: alterarSenhaAntigaAdm
      security:
        - adminCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /auth/signup:
    post:
      tags: [Autenticação]
      summary: Criar conta
      operationId: signup
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /auth/signin:
    post:
      tags: [Autenticação]
      summary: Iniciar sessão
      operationId: signin
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /auth/signin/google:
    get:
      tags: [Autenticação]
      summary: Iniciar autenticação Google por redirecionamento
      operationId: signinGoogleRedirect
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Autenticação]
      summary: Iniciar sessão com Google
      operationId: signinGoogle
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /auth/signout:
    post:
      tags: [Autenticação]
      summary: Encerrar sessão
      operationId: signout
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /auth/refresh:
    post:
      tags: [Autenticação]
      summary: Atualizar sessão
      operationId: refreshSession
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /auth/session:
    post:
      tags: [Autenticação]
      summary: Definir sessão
      operationId: setSession
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
    get:
      tags: [Autenticação]
      summary: Consultar sessão atual
      operationId: getSession
      security:
        - clientCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /auth/redefinir-senha:
    post:
      tags: [Autenticação]
      summary: Redefinir senha
      operationId: redefinirSenha
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /auth/esquecer-senha:
    post:
      tags: [Autenticação]
      summary: Solicitar recuperação de senha
      operationId: esquecerSenha
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /auth/callback-redefinir-senha/:
    get:
      tags: [Autenticação]
      summary: Processar callback de redefinição de senha
      operationId: callbackRedefinirSenha
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /auth/senha:
    patch:
      tags: [Autenticação]
      summary: Atualizar senha da conta
      operationId: atualizarSenha
      security:
        - clientCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /auth/perfil:
    get:
      tags: [Autenticação]
      summary: Consultar usuário autenticado
      operationId: getAuthProfile
      security:
        - clientCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/autopublicacao:
    get:
      tags: [Autopublicação]
      summary: Listar livros de autopublicação com filtros
      operationId: listarAutopublicacoes
      security:
        - clientCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Autopublicação]
      summary: Criar livro para autopublicação
      operationId: criarAutopublicacao
      security:
        - clientCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/autopublicacao/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Autopublicação]
      summary: Consultar livro de autopublicação
      operationId: buscarAutopublicacao
      security:
        - clientCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
    patch:
      tags: [Autopublicação]
      summary: Atualizar livro de autopublicação
      operationId: atualizarAutopublicacao
      security:
        - clientCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Autopublicação]
      summary: Excluir rascunho de autopublicação
      operationId: excluirAutopublicacao
      security:
        - clientCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/autopublicacao/upload-url:
    post:
      tags: [Autopublicação]
      summary: Criar URL de upload de livro
      operationId: criarUploadLivro
      security:
        - clientCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/autopublicacao/estado/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Autopublicação]
      summary: Atualizar estado da autopublicação
      operationId: atualizarEstadoAutopublicacao
      security:
        - clientCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/enderecos:
    get:
      tags: [Endereços]
      summary: Listar endereços do usuário
      operationId: listarEnderecos
      security:
        - clientCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
    post:
      tags: [Endereços]
      summary: Criar endereço
      operationId: criarEndereco
      security:
        - clientCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/enderecos/principal:
    get:
      tags: [Endereços]
      summary: Consultar endereço principal
      operationId: buscarEnderecoPrincipal
      security:
        - clientCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/enderecos/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Endereços]
      summary: Consultar endereço
      operationId: buscarEndereco
      security:
        - clientCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [Endereços]
      summary: Atualizar endereço
      operationId: atualizarEndereco
      security:
        - clientCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/enderecos/{id}/ativo:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Endereços]
      summary: Inativar endereço
      operationId: inativarEndereco
      security:
        - clientCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/enderecos/{id}/principal:
    parameters:
      - $ref: "#/components/parameters/Id"
    patch:
      tags: [Endereços]
      summary: Definir endereço principal
      operationId: definirEnderecoPrincipal
      security:
        - clientCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/livros:
    get:
      tags: [Livros]
      summary: Listar livros
      operationId: listarLivros
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/livros/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      tags: [Livros]
