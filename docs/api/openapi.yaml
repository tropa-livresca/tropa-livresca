components:
  securitySchemes:
    clientCookieAuth:
      type: apiKey
      in: cookie
      name: auth-token
      description: Cookie de sessão do usuário.
    adminCookieAuth:
      type: apiKey
      in: cookie
      name: admin-token
      description: Cookie de sessão administrativa.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Identificador no formato aceito pela rota (bigint ou UUID conforme o recurso).
    Page:
      name: page
      in: query
      description: Página, começando em 1.
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Quantidade de itens por página.
      schema:
        type: integer
        minimum: 1
        default: 12
  schemas:
    ErrorResponse:
      type: object
      required: [status, statusCode, error]
      properties:
        status:
          type: string
          example: error
        statusCode:
          type: integer
          description: Repete o código HTTP da resposta.
        error:
          type: string
    LivroEstado:
      type: string
      enum: [rascunho, em_revisao, publicado, negado, recall]
    LivroEstadoFiltro:
      type: string
      enum: [rascunho, em_revisao, publicado, negado, recall, ""]
    MetaPaginacao:
      type: object
      properties:
        totalItems:
          type: integer
        totalPages:
          type: integer
        page:
          type: integer
        limit:
          type: integer
    CapaLivro:
      type: object
      nullable: true
      description: JSONB armazenado como paths; em respostas, os valores de capa são URLs assinadas.
      properties:
        frente:
          type: string
          nullable: true
        verso:
          type: string
          nullable: true
        orelhas:
          type: string
          nullable: true
    LivroAutopublicacao:
      type: object
      required: [id, estado, titulo, capa, manuscrito]
      properties:
        id:
          type: integer
          format: int64
        estado:
          $ref: "#/components/schemas/LivroEstado"
        titulo:
          type: string
        subtitulo:
          type: string
        capa:
          $ref: "#/components/schemas/CapaLivro"
        capaPaths:
          $ref: "#/components/schemas/CapaLivro"
        manuscrito:
          type: string
          nullable: true
          description: URL assinada para leitura do PDF.
        manuscritoPath:
          type: string
          nullable: true
    PaginaLivros:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LivroAutopublicacao"
        meta:
          allOf:
            - $ref: "#/components/schemas/MetaPaginacao"
    DetalhesAutopublicacao:
      type: object
      properties:
        ISBN:
          type: string
          nullable: true
        titulo:
          type: string
        subtitulo:
          type: string
        descricao:
          type: string
        numeroEdicao:
          oneOf:
            - type: string
            - type: integer
        idioma:
          type: string
        categoria:
          type: string
        autor:
          type: object
          properties:
            nome:
              type: string
            sobrenome:
              type: string
        colaboradores:
          type: array
          items:
            type: object
            properties:
              funcao:
                type: string
              nome:
                type: string
              sobrenome:
                type: string
        direitoPublicacao:
          oneOf:
            - type: string
              enum: [sim, nao]
            - type: boolean
    OrcamentoAutopublicacao:
      type: object
      properties:
        numeroPaginas:
          oneOf:
            - type: string
            - type: integer
        valorLivroDigital:
          oneOf:
            - type: string
            - type: number
        valorLivroFisico:
          oneOf:
            - type: string
            - type: number
    AutopublicacaoPayload:
      type: object
      required: [dadosLivro]
      properties:
        dadosLivro:
          type: object
          required: [detalhes, orcamento]
          properties:
            detalhes:
              $ref: "#/components/schemas/DetalhesAutopublicacao"
            orcamento:
              $ref: "#/components/schemas/OrcamentoAutopublicacao"
        capa:
          $ref: "#/components/schemas/CapaLivro"
        capaPaths:
          $ref: "#/components/schemas/CapaLivro"
        manuscritoPath:
          type: string
          nullable: true
    CriarAutopublicacaoRequest:
      allOf:
        - $ref: "#/components/schemas/AutopublicacaoPayload"
        - type: object
          properties:
            estadoInicial:
              type: string
              enum: [rascunho]
              default: rascunho
    AtualizarAutopublicacaoRequest:
      allOf:
        - $ref: "#/components/schemas/AutopublicacaoPayload"
    AutopublicacaoSalva:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/LivroAutopublicacao"
        manuscritoUrl:
          type: string
          nullable: true
    AtualizarEstadoLivroRequest:
      type: object
      required: [novoEstado]
      properties:
        novoEstado:
          $ref: "#/components/schemas/LivroEstado"
    UploadLivroRequest:
      type: object
      required: [tipo, extensao, mimeType, tamanho]
      properties:
        tipo:
          type: string
          enum: [capa_frente, capa_verso, capa_orelhas, manuscrito]
        extensao:
          type: string
          description: jpg/jpeg/png para capas; pdf para manuscrito.
        mimeType:
          type: string
        tamanho:
          type: integer
          minimum: 1
          description: Tamanho do arquivo em bytes; limite de 10 MiB para capas e 50 MiB para manuscrito.
    UploadUrlResponse:
      type: object
      required: [bucket, path, token]
      properties:
        bucket:
          type: string
          enum: [capa-livros, manuscrito-livro]
        path:
          type: string
        token:
          type: string
    LimparUploadsRequest:
      type: object
      required: [arquivos]
      properties:
        arquivos:
          type: array
          items:
            type: object
            required: [tipo, path]
            properties:
              tipo:
                type: string
                enum: [capa_frente, capa_verso, capa_orelhas, manuscrito]
              path:
                type: string
    Revisao:
      type: object
      required:
        [id, arquivo, data_criacao, fk_user_profile_id, fk_livro_id, completado]
      properties:
        id:
          type: integer
          format: int64
        arquivo:
          type: string
          description: URL assinada do PDF da revisão; a coluna persistida é text NOT NULL.
        arquivoPath:
          type: string
        data_criacao:
          type: string
          format: date-time
        apontamento:
          type: string
          nullable: true
        fk_user_profile_id:
          type: string
          format: uuid
        fk_livro_id:
          type: integer
          format: int64
        nome:
          type: string
          nullable: true
        completado:
          type: boolean
        livros:
          type: object
          additionalProperties: true
    PaginaRevisoes:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Revisao"
        livros:
          type: array
          items:
            type: object
            additionalProperties: true
        meta:
          $ref: "#/components/schemas/MetaPaginacao"
    CriarRevisaoRequest:
      type: object
      required: [nome, apontamento, idLivro, manuscritoRevisto]
      properties:
        nome:
          type: string
        apontamento:
          type: string
        idLivro:
          type: integer
          format: int64
        manuscritoRevisto:
          type: string
          format: binary
          description: PDF obrigatório, máximo de 50 MiB.
    AtualizarRevisaoRequest:
      type: object
      properties:
        nome:
          type: string
        apontamento:
          type: string
        idLivro:
          type: integer
          format: int64
          description: Se enviado, deve ser o mesmo livro já associado à revisão.
        manuscritoRevisto:
          type: string
          format: binary
          description: PDF opcional; quando omitido, mantém o arquivo atual.
    DecisaoRevisaoRequest:
      type: object
      required: [idLivro]
      properties:
        idLivro:
          type: integer
          format: int64
    AdminSigninRequest:
