components:
  securitySchemes:
    clientCookieAuth:
      type: apiKey
      in: cookie
      name: auth-token
      description: Cookie de sessão do usuário.
    adminCookieAuth:
      type: apiKey
      in: cookie
      name: admin-token
      description: Cookie de sessão administrativa.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
      description: Identificador do recurso.
  responses:
    Success:
      description: Requisição processada com sucesso.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
    Error:
      description: A requisição não pôde ser processada.
      content:
        application/json:
          schema:
            type: object
            additionalProperties: true
