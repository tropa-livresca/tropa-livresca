    get:
      tags: [Autores]
      summary: Consultar autor
      operationId: buscarAutor
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/suporte/enviarEmail:
    post:
      tags: [Suporte]
      summary: Enviar mensagem ao suporte
      operationId: enviarEmailSuporte
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/perfil/imagem:
    patch:
      tags: [Perfil]
      summary: Atualizar imagem do perfil
      operationId: atualizarImagemPerfil
      security:
        - clientCookieAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                imagem:
                  type: string
                  format: binary
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
    delete:
      tags: [Perfil]
      summary: Remover imagem do perfil
      operationId: removerImagemPerfil
      security:
        - clientCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/perfil:
    get:
      tags: [Perfil]
      summary: Consultar perfil
      operationId: buscarPerfil
      security:
        - clientCookieAuth: []
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
    put:
      tags: [Perfil]
      summary: Atualizar perfil
      operationId: atualizarPerfil
      security:
        - clientCookieAuth: []
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          $ref: "#/components/responses/Success"
        default:
          $ref: "#/components/responses/Error"
  /clients/loja:
    get:
      tags: [Loja]
